[binaries]
c = '/project/workspace/python/build/toolchain/bin/arm-linux-gnueabi-gcc'
cpp = '/project/workspace/python/build/toolchain/bin/arm-linux-gnueabi-g++'
fortran = '/project/workspace/python/build/toolchain/bin/arm-linux-gnueabi-gfortran'
ar = 'arm-linux-gnueabi-ar'
strip = 'arm-linux-gnueabi-strip'
pkg-config = ['pkg-config', '--static']
python = '/project/workspace/python/build/crossenv/bin/cross-python'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
needs_exe_wrapper = true
longdouble_format = 'IEEE_DOUBLE_LE'
sys_root = '/project/workspace/python/prefix'
numpy-include-dir = '/project/workspace/python/prefix/opt/benro-python/lib/python3.13/site-packages/numpy/_core/include'
pythran-include-dir = '/project/workspace/python/build/host-python/lib/python3.13/site-packages/pythran'

[built-in options]
c_args = ['-O2', '-fPIC', '-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=softfp', '-I/project/workspace/python/prefix/opt/benro-python/include']
cpp_args = ['-O2', '-fPIC', '-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=softfp', '-I/project/workspace/python/prefix/opt/benro-python/include']
fortran_args = ['-O2', '-fPIC', '-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=softfp']
c_link_args = ['-L/project/workspace/python/prefix/opt/benro-python/lib', '-Wl,-rpath-link,/project/workspace/python/prefix/opt/benro-python/lib']
cpp_link_args = ['-L/project/workspace/python/prefix/opt/benro-python/lib', '-Wl,-rpath-link,/project/workspace/python/prefix/opt/benro-python/lib']
fortran_link_args = ['-L/project/workspace/python/prefix/opt/benro-python/lib', '-Wl,-rpath-link,/project/workspace/python/prefix/opt/benro-python/lib']
